[project]
name = "cli-tareas"
version = "0.1.0"
description = "CLI para gestionar tareas asistidas por IA (DAM)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.19",
    "rich>=14",
]

[project.scripts]
tareas = "cli_tareas.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-ignore = ["B008"]
